[project]
name = "whatsapp-chat-autoexport"
version = "0.3.0"
description = "WhatsApp chat export automation for Android (Appium-driven, Google Drive, optional transcription)."
readme = "README.md"
requires-python = ">=3.13,<4.0"
authors = [
    { name = "AJ Anderson", email = "ajanderson1@gmail.com" },
]
license = { text = "MIT" }
dependencies = [
    "appium-python-client>=5.2.4,<6.0.0",
    "ipykernel>=7.1.0,<8.0.0",
    "colorama>=0.4.6,<1.0.0",
    "google-api-python-client>=2.100.0,<3.0.0",
    "google-auth-httplib2>=0.2.0,<1.0.0",
    "google-auth-oauthlib>=1.1.0,<2.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "openai>=1.0.0,<2.0.0",
    "elevenlabs>=1.0.0,<2.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "rich>=14.3.1,<15.0.0",
    "typer>=0.21.1,<1.0.0",
    "textual>=0.94.0",
]

[project.scripts]
whatsapp = "whatsapp_chat_autoexport.cli_entry:main"
whatsapp-export = "whatsapp_chat_autoexport.deprecated_entry:whatsapp_export_main"
whatsapp-process = "whatsapp_chat_autoexport.deprecated_entry:whatsapp_process_main"
whatsapp-drive = "whatsapp_chat_autoexport.deprecated_entry:whatsapp_drive_main"
whatsapp-pipeline = "whatsapp_chat_autoexport.deprecated_entry:whatsapp_pipeline_main"
whatsapp-logs = "whatsapp_chat_autoexport.deprecated_entry:whatsapp_logs_main"
whatsapp-sync = "whatsapp_chat_autoexport.cli.commands.sync:main"
whatsapp-ingest = "whatsapp_chat_autoexport.cli.commands.ingest:main"
whatsapp-migrate = "whatsapp_chat_autoexport.cli.commands.migrate:main"
whatsapp-rebuild = "whatsapp_chat_autoexport.cli.commands.rebuild:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.11.1,<4.0.0",
    "pytest-timeout>=2.1.0,<3.0.0",
    "pytest-asyncio>=0.23,<1.0.0",
    "ruff>=0.11,<1.0.0",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_chat_autoexport"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=whatsapp_chat_autoexport",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=0",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_api: marks tests that require API keys",
    "requires_device: marks tests that require an Android device",
    "requires_drive: marks tests that require live Google Drive credentials and the fixture folder env var",
    "unit: marks tests as unit tests",
    "manual: marks tests that must be run by a human with real credentials (skipped in CI)",
]
timeout = 300
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/whatsapp_chat_autoexport"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    "docs/tests_old/",  # archived test snapshots — not part of the active suite
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",   # line too long — enforced by formatter
    "B008",   # function calls in argument defaults
    # Pre-existing violations silenced at verify.sh baseline (PR 4/5).
    # TODO: address these incrementally and remove from ignore list.
    "E722",   # bare except: — legacy modules use this pattern
    "F821",   # undefined name — false positives from TYPE_CHECKING forward refs
    "F841",   # local variable assigned but never used — noise in legacy code
    "E402",   # module level import not at top — scripts/legacy pattern
    "B007",   # loop control variable unused
    "B904",   # raise without from in except handler
    "E712",   # comparison to True/False/None
    "B905",   # zip() without strict= argument
    "E741",   # ambiguous variable name
    "UP042",  # class inherits str+Enum instead of StrEnum — migration needed
    "UP046",  # Generic class uses Generic[] instead of PEP 695 syntax
    "UP047",  # Generic function should use PEP 695 type parameters
    "UP007",  # Union[X, Y] instead of X | Y — used in older-style type aliases
]

[tool.ruff.lint.isort]
known-first-party = ["whatsapp_chat_autoexport"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["whatsapp_chat_autoexport"]
mypy_path = "src"
exclude = [
    "tests/",
    "build/",
    "dist/",
]

# Per-module overrides for legacy / noisy modules.
# Goal: each entry is a TODO — remove the override and type-clean the module over time.
[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.whatsapp_export"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.whatsapp_process"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.legacy.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.tui.*"
ignore_errors = true

# TODO: type-clean and remove these overrides incrementally.
[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.core.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.config.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.transcription.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.export.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.utils.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.state.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.preflight.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.sources.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.mcp.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.processing.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.output.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.google_drive.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.automation.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.whatsapp.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "whatsapp_chat_autoexport.pipeline_cli.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "whatsapp_chat_autoexport.pipeline",
    "whatsapp_chat_autoexport.headless",
    "whatsapp_chat_autoexport.cli_entry",
    "whatsapp_chat_autoexport.deprecated_entry",
    "whatsapp_chat_autoexport.constants",
    "whatsapp_chat_autoexport.cli.*",
]
ignore_errors = true

# Third-party modules without stubs — silence missing-imports for these only.
[[tool.mypy.overrides]]
module = [
    "appium.*",
    "selenium.*",
    "elevenlabs.*",
    "google.*",
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google_auth_httplib2.*",
    "colorama",
    "textual.*",
    "rich.*",
    "tqdm",
    "typer",
    "pydantic_settings",
]
ignore_missing_imports = true
